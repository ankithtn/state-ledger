[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateledger"
version = "0.1.0"
description = "Persistent, evidence-backed memory for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
# M3 adds the MCP server. M1 does not import or run it.
mcp = ["mcp==2.3.0"]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stateledger = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"